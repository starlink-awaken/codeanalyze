[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeanalyze"
version = "0.1.0"
description = "Unified code & document analysis toolkit — Graphify + GitNexus + Serena + Docling + MinerU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Workspace Team"}]
keywords = ["code-analysis", "knowledge-graph", "document-analysis", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
all = [
    "graphifyy",
    "docling",
    "docling-graph",
    "marker-pdf",
]

[project.scripts]
codeanalyze = "codeanalyze.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/codeanalyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
